version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobswipe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  kawsai:
    build:
      context: ./projectcore-kawsai
    ports:
      - "8001:8001"
    environment:
      QDRANT_HOST: http://qdrant:6333
    depends_on:
      - qdrant

  backend:
    build:
      context: ./projectcore-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/jobswipe
      QDRANT_HOST: http://qdrant:6333
      SECRET_KEY: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      IA_API_BASE_URL: http://kawsai:8001
      # Correos de recuperación de contraseña (vacío = solo log en consola)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-JobSwipe <no-reply@jobswipe.com>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      - db
      - qdrant
      - kawsai
    working_dir: /app
    volumes:
      - ./projectcore-backend:/app:Z

volumes:
  postgres_data:
  qdrant_data:
